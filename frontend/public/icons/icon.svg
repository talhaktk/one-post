<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium saffron gradient (top-light to bottom-deep) -->
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Subtle inner gloss for premium feel -->
    <linearGradient id="gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.20"/>
      <stop offset="32%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow on the mark -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- iOS-style rounded square background -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" ry="114" fill="url(#gloss)"/>

  <!-- Geometric mark: bold "1" with a broadcast dot above -->
  <g filter="url(#shadow)">
    <!-- Single broadcast dot above the 1 — represents "one → everywhere" -->
    <circle cx="256" cy="120" r="20" fill="white"/>

    <!-- Bold geometric "1" -->
    <!-- Diagonal top flag -->
    <path d="M 178 230 L 248 178 L 308 178 L 308 250 L 248 250 Z" fill="white"/>
    <!-- Vertical stem (slightly wider, balanced) -->
    <rect x="248" y="178" width="60" height="225" fill="white"/>
    <!-- Wider base -->
    <rect x="178" y="388" width="200" height="46" rx="8" ry="8" fill="white"/>
  </g>
</svg>
